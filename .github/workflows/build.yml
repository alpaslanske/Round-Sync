name: Android CI Signed & Release

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: 'Telegram ile oluştur'
        type: boolean
        default: false

  push:
    tags:
      - 'v*'

jobs:
  build-signed:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:

      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------
      # JDK
      # -----------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ---------------------------------------------------------
      # RELEASE'DEN HAZIR RCLONE KÜTÜPHANELERİNİ ÇEK (app/lib/*.so)
      # ---------------------------------------------------------
      # - name: Download prebuilt rclone from v2.6.5 release
      #   id: download-rclone
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     if gh release download v2.6.5 --pattern "*universal-release.apk" --output universal.apk; then
      #       unzip -o universal.apk "lib/*/librclone.so" -d app/
      #       rm universal.apk
      #       echo "prebuilt=true" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "Release dosyası indirilemedi, sıfırdan derlenecek..."
      #       echo "prebuilt=false" >> "$GITHUB_OUTPUT"
      #     fi
      # ---------------------------------------------------------
      # ASIL REPODAN HAZIR RCLONE KÜTÜPHANELERİNİ ÇEK (app/lib/*.so)
      # ---------------------------------------------------------
      - name: Download prebuilt rclone from upstream latest release
        id: download-rclone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download --repo gulp79/Round-Sync --pattern "*universal-release.apk" --output universal.apk; then
            unzip -o universal.apk "lib/*/librclone.so" -d app/
            rm universal.apk
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release dosyası indirilemedi, sıfırdan derlenecek..."
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------
      # GO (Sadece hazır rclone indirilemezse çalışır)
      # -----------------------------
      - name: Setup Go
        if: steps.download-rclone.outputs.prebuilt != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      # -----------------------------
      # ANDROID NDK (Sadece hazır rclone indirilemezse çalışır)
      # -----------------------------
      - name: Setup Android NDK
        if: steps.download-rclone.outputs.prebuilt != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      # -----------------------------
      # KEYSTORE
      # -----------------------------
      - name: Decode Keystore
        if: ${{ env.APP_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p app
          echo "$APP_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      # -----------------------------
      # VERSION FROM TAG
      # -----------------------------
      - name: Resolve app version from git tag
        id: app_version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          VERSION="${RAW_TAG#v}"
          if [[ -z "$VERSION" ]]; then
            VERSION=$(grep '^de\.felixnuesse\.extract\.versionName=' gradle.properties | cut -d'=' -f2)
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # BUILD AND SIGN
      # -----------------------------
      - name: Build Signed Release APK (ALL SPLITS)
        env:
          CMD_RELEASE_KEYSTORE: release.keystore
          CMD_RELEASE_KEYSTORE_PASSWORD: ${{ env.KEY_STORE_PASSWORD }}
          CMD_RELEASE_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CMD_RELEASE_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version }}
        run: |
          chmod +x ./gradlew
          echo "Hazır rclone kütüphaneleriyle APK derleniyor (versione: $APP_VERSION_NAME)..."
          ./gradlew assembleOssRelease --stacktrace

      ###########################################################
      # ARTIFACT AYRIMI
      ###########################################################

      - name: Upload APK arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-arm64-v8a
          path: app/build/outputs/apk/oss/release/*-oss-arm64-v8a-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload APK armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-armeabi-v7a
          path: app/build/outputs/apk/oss/release/*-oss-armeabi-v7a-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload APK x86
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-x86
          path: app/build/outputs/apk/oss/release/*-oss-x86-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload APK x86_64
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-x86_64
          path: app/build/outputs/apk/oss/release/*-oss-x86_64-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload APK universal
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-universal
          path: app/build/outputs/apk/oss/release/*-oss-universal-release.apk
          retention-days: 90
          if-no-files-found: warn

      ###########################################################
      # RELEASE SU TAG
      ###########################################################
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/oss/release/*-oss-arm64-v8a-release.apk
            app/build/outputs/apk/oss/release/*-oss-armeabi-v7a-release.apk
            app/build/outputs/apk/oss/release/*-oss-x86-release.apk
            app/build/outputs/apk/oss/release/*-oss-x86_64-release.apk
            app/build/outputs/apk/oss/release/*-oss-universal-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ###########################################################
      # TELEGRAM (OPZIONALE)
      ###########################################################
      - name: Send to Telegram
        if: ${{ github.event.inputs.send_telegram == 'true' && success() }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *Nuova Build Disponibile*
            Repo: ${{ github.repository }}
            Branch/Tag: ${{ github.ref_name }}
            I file APK sono allegati qui sotto.
          document: |
            app/build/outputs/apk/oss/release/*-oss-arm64-v8a-release.apk
